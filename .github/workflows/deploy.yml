name: Deploy FTP and Update

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Web Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configuration de la clé SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Ajouter HOST aux hôtes connus (Known Hosts)
        env:
          SSH_SERVER: ${{ secrets.SSH_SERVER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            # Pinned server key (ssh-keyscan -H <server>, checked once by hand)
            echo "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS secret missing, trusting the key presented by the server"
            ssh-keyscan -H "$SSH_SERVER" >> ~/.ssh/known_hosts
          fi

      - name: Configure PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Synchronization Files
        env:
          SSH_SERVER: ${{ secrets.SSH_SERVER }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          # Secrets pasted in GitHub often end with a newline or a space:
          # trim them, and quote the destination (one argument whatever it holds)
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          user="$(trim "$SSH_USER")"; server="$(trim "$SSH_SERVER")"; dir="$(trim "$FTP_SERVER_DIR")"
          dir="${dir%/}"
          if [ -z "$user" ] || [ -z "$server" ] || [ -z "$dir" ]; then
            echo "::error::SSH_USER, SSH_SERVER and FTP_SERVER_DIR secrets are required"
            exit 1
          fi
          # files/: former uploads, kept on the server until imported on the
          # files service
          rsync -avz --checksum --no-perms --no-owner --no-group --delete \
            --exclude='.git*' \
            --exclude='.htaccess' \
            --exclude='parameters.*.php' \
            --exclude='/cache' \
            --exclude='/files' \
            --exclude='deploy.log' \
            ./ "$user@$server:$dir/"

      - name: Run Update Script On Server
        env:
          SSH_SERVER: ${{ secrets.SSH_SERVER }}
          SSH_USER: ${{ secrets.SSH_USER }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          user="$(trim "$SSH_USER")"; server="$(trim "$SSH_SERVER")"; dir="$(trim "$FTP_SERVER_DIR")"
          # php is php-cgi on the server, use the CLI matching the CI PHP version
          ssh "$user@$server" "cd '${dir%/}' && PHP_BIN=/usr/bin/php8.2-cli bash bin/deploy.sh"
