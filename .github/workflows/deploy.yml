name: Deploy FTP and Update

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Web Deployment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Synchronization FTP
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
      - name: Run Update Script
        run: |
          curl -s "https://api.rollerlesloups.fr/update.php?secret=${{ secrets.DEPLOY_SECRET }}"